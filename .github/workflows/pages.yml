name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the Pages deployment read the repo and mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede each other without cancelling
# a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site
        # PAGES_BASE must match the repository name so the hashed asset URLs
        # resolve under https://<owner>.github.io/<repo>/.
        run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Switch Pages to workflow builds
        # This repository's Pages site was first enabled in branch mode, so
        # every push to main ALSO kicks a Jekyll "pages build and deployment"
        # that republishes the repo source (the rendered README) over this
        # workflow's deployment — whichever finishes last wins. Flipping
        # build_type to "workflow" stops those Jekyll builds for good.
        # No-op once it has been set.
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $code"
          cat /tmp/pages.json || true
          if [ "$code" != "204" ]; then
            echo "::warning::Could not switch Pages to workflow builds (HTTP $code). Set Settings -> Pages -> Source: GitHub Actions by hand, or Jekyll will keep overwriting this deployment."
          fi
          echo "--- current Pages config ---"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so the repository does not
          # need the Settings -> Pages source switched by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
