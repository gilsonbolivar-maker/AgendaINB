name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the Pages deployment read the repo and mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs supersede each other without cancelling
# a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site
        # PAGES_BASE must match the repository name so the hashed asset URLs
        # resolve under https://<owner>.github.io/<repo>/.
        run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so the repository does not
          # need the Settings -> Pages source switched by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
